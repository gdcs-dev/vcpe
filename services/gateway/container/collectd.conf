# collectd config for the gateway's local rbus data-model collection.
#
# This is a standalone, OTLP-free path: collectd polls/subscribes to TR-181
# values over rbus and persists them to local RRDs under
# /var/lib/collectd/rrd. It does not touch otel-relay, telemetry_agent, or
# any cloud delivery path -- see openspec/changes/add-collectd-rbus-plugin.

BaseDir "/var/lib/collectd"
PIDFile "/run/collectd.pid"
Interval 60

TypesDB "/usr/share/collectd/types.db"
# Installed by the collectd-rbus-plugin package (built from
# git/collectd-rbus-plugin/) alongside its rbus.so; see
# openspec/changes/add-collectd-rbus-plugin/design.md.
TypesDB "/usr/share/collectd-rbus-plugin/types.db.rdk"

LoadPlugin syslog
<Plugin syslog>
   LogLevel "info"
</Plugin>

LoadPlugin rbus
<Plugin rbus>
   # Polled scalar: a plain TR-181 leaf, refreshed on its own interval.
   <Path "Device.DeviceInfo.UpTime">
      Mode "Poll"
      Interval 60
      Type "uptime"
      ValueType "gauge"
   </Path>

   # Subscribed scalar: dispatched immediately on an rbus VALUE_CHANGED
   # event instead of waiting for a poll interval.
   <Path "Device.Bridging.Bridge.1.Port.1.Enable">
      Mode "Subscribe"
      Type "rdk_bridge_port_enabled"
      ValueType "gauge"
   </Path>

   # Polled table: "{i}" is discovered against rbus's own row set on every
   # collection -- no static index list to maintain as ports are added or
   # removed.
   <Path "Device.Bridging.Bridge.1.Port.{i}.Stats.BytesSent">
      Mode "Poll"
      Interval 60
      Type "rdk_bridge_port_bytes"
      ValueType "counter"
   </Path>
</Plugin>

LoadPlugin rrdtool
<Plugin rrdtool>
   DataDir "/var/lib/collectd/rrd"
</Plugin>
