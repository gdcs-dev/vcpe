apiVersion: vcpe.dev/v1
kind: Deployment
metadata: {name: edge}
spec:
  networks: []
  wirelessNetworks:
    - {name: home, ssid: vcpe-lab, security: open, passphraseSecretRef: home-wifi}
  secrets:
    - {name: home-wifi, provider: env, key: VCPE_HOME_WIFI}
  services:
    - {name: client, type: generic-container, replicas: 1, image: {repository: client}}
