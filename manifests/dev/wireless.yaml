apiVersion: vcpe.dev/v1
kind: Deployment
metadata:
  name: wireless
  labels:
    scenario: wireless
    environment: development
  annotations:
    description: "Tri-band vCPE lab with segmented Gateway VAPs and wireless clients."
spec:
  maxReplicasPerService: 3
  maxActiveDeployments: 10
  #
  #   [internet / host]
  #        |
  #   mgmt-bridge (10.10.10.0/24)  ── BNG eth0, WebPA eth0
  #        |
  #   wan-bridge  (10.7.200.0/24)  ── BNG eth1 (DHCP server)
  #        |                              GATEWAY wan (DHCP client, erouter0)
  #   cm-bridge   (10.7.201.0/24)  ── BNG eth2 (DHCP server)
  #        |                              GATEWAY cm
  #   lan-p1-bridge -- GATEWAY (eth0)
  #   lan-p2-bridge -- GATEWAY (eth1)
  #   lan-p3-bridge -- GATEWAY (eth2)
  #   lan-p4-bridge -- GATEWAY (eth3)
  #   2.4/5/6 GHz WLANs -- GATEWAY APs -- per-band wireless clients
  networks:
    - role: mgmt
      ipv4:
        cidr: 10.10.10.0/24
        gateway: 10.10.10.1
        pool: { start: 10.10.10.10, end: 10.10.10.250 }
    - role: wan
      nat: true
      firewall: true
      ipamDriver: none
      ipv4:
        cidr: 10.7.200.0/24
        gateway: 10.7.200.1
        pool: { start: 10.7.200.10, end: 10.7.200.250 }
    - role: cm
      ipamDriver: none
      ipv4:
        cidr: 10.7.201.0/24
        gateway: 10.7.201.1
        pool: { start: 10.7.201.10, end: 10.7.201.250 }
    # GATEWAY LAN ports
    - role: lan-p1
      ipamDriver: none
    - role: lan-p2
      ipamDriver: none
    - role: lan-p3
      ipamDriver: none
    - role: lan-p4
      ipamDriver: none
  wirelessMedia:
    - {name: rf24, band: 2.4ghz, channel: 1, widthMHz: 20}
    - {name: rf5, band: 5ghz, channel: 36, widthMHz: 20}
    - {name: rf6, band: 6ghz, channel: 5, widthMHz: 20}
  wirelessNetworks:
    - {name: home, ssid: vcpe-lab, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: guest, ssid: vcpe-guest, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: iot, ssid: vcpe-iot, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: hotspot, ssid: vcpe-hotspot, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: backhaul, ssid: vcpe-backhaul, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: lab-a, ssid: vcpe-lab-a, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: lab-b, ssid: vcpe-lab-b, security: wpa3-personal, passphraseSecretRef: home-wifi}
    - {name: lab-c, ssid: vcpe-lab-c, security: wpa3-personal, passphraseSecretRef: home-wifi}
  secrets:
    - name: home-wifi
      provider: literal
      value: vcpe-development-only
  services:
    # ── BNG ─────────────────────────────────────────────────────────────────
    # Broadband Network Gateway: DHCP4/RADVD/DNS on WAN and CM segments,
    # iptables MASQUERADE for WAN traffic leaving via mgmt.
    - name: bng
      type: bng
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/bng
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/bng
      interfaces:
        - { role: mgmt, device: mgmt0 }
        - { role: wan, device: wan0, defaultRoute: true, ipv4: "10.7.200.1", addressing: static }
        - { role: cm, device: cm0, ipv4: "10.7.201.1", addressing: static }
      config:
        access:
          - role: wan
            dhcp4:
              subnet: 10.7.200.0/24
              ranges:
                - { start: 10.7.200.100, end: 10.7.200.200 }
              options:
                routers: 10.7.200.1
              leaseSeconds: 3600
          - role: cm
            dhcp4:
              subnet: 10.7.201.0/24
              ranges:
                - { start: 10.7.201.100, end: 10.7.201.200 }
              options:
                routers: 10.7.201.1
              leaseSeconds: 3600
    # ── WebPA / WebConfig ────────────────────────────────────────────────────
    # USP/WebPA device-management server; CPEs contact it via mgmt network.
    - name: webpa
      type: webpa
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/webpa
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/webpa
      interfaces:
        - { role: mgmt }
      dependsOn:
        - bng
    # ── GATEWAY ──────────────────────────────────────────────────────────────
    # Cable-modem / CPE simulator. Gets DHCP leases from BNG on WAN and CM,
    # bridges wired LAN ports and the wireless AP into brlan0, and serves LAN
    # DHCP to the wireless client.
    - name: gateway
      type: gateway
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/gateway
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/gateway
      interfaces:
        - { role: wan, device: erouter0, addressing: dhcp, defaultRoute: true }
        - { role: cm, device: wan0, addressing: dhcp }
        - { role: lan-p1, device: eth0, bridge: brlan0 }
        - { role: lan-p2, device: eth1, bridge: brlan0 }
        - { role: lan-p3, device: eth2, bridge: brlan0 }
        - { role: lan-p4, device: eth3, bridge: brlan0 }
      bridges:
        - name: brlan0
          ipv4: 10.0.0.1/24
          dhcpStart: 10.0.0.100
          dhcpEnd: 10.0.0.200
        - {name: brguest, ipv4: 10.0.1.1/24, dhcpStart: 10.0.1.100, dhcpEnd: 10.0.1.200}
        - {name: briot, ipv4: 10.0.2.1/24, dhcpStart: 10.0.2.100, dhcpEnd: 10.0.2.200}
        - {name: brhotspot, ipv4: 10.0.3.1/24, dhcpStart: 10.0.3.100, dhcpEnd: 10.0.3.200}
        - {name: brbackhaul, ipv4: 10.0.4.1/24, dhcpStart: 10.0.4.100, dhcpEnd: 10.0.4.200}
      radios:
        - name: ap24
          medium: rf24
          device: wlan0
          mode: ap
          vaps:
            - {slot: 0, network: home, bridge: brlan0}
            - {slot: 1, network: guest, bridge: brguest}
            - {slot: 2, network: iot, bridge: briot}
            - {slot: 3, network: hotspot, bridge: brhotspot}
            - {slot: 4, network: backhaul, bridge: brbackhaul}
            - {slot: 5, network: lab-a, bridge: brlan0}
            - {slot: 6, network: lab-b, bridge: brguest}
            - {slot: 7, network: lab-c, bridge: briot}
        - name: ap5
          medium: rf5
          device: wlan1
          mode: ap
          vaps:
            - {slot: 0, network: home, bridge: brlan0}
            - {slot: 1, network: guest, bridge: brguest}
            - {slot: 2, network: iot, bridge: briot}
            - {slot: 3, network: hotspot, bridge: brhotspot}
            - {slot: 4, network: backhaul, bridge: brbackhaul}
            - {slot: 5, network: lab-a, bridge: brlan0}
            - {slot: 6, network: lab-b, bridge: brguest}
            - {slot: 7, network: lab-c, bridge: briot}
        - name: ap6
          medium: rf6
          device: wlan2
          mode: ap
          vaps:
            - {slot: 0, network: home, bridge: brlan0}
            - {slot: 1, network: guest, bridge: brguest}
            - {slot: 2, network: iot, bridge: briot}
            - {slot: 3, network: hotspot, bridge: brhotspot}
            - {slot: 4, network: backhaul, bridge: brbackhaul}
            - {slot: 5, network: lab-a, bridge: brlan0}
            - {slot: 6, network: lab-b, bridge: brguest}
            - {slot: 7, network: lab-c, bridge: briot}
      config:
        env:
          LAN_DNS: "10.0.0.1"
      dependsOn:
        - bng
    - name: client-24
      type: generic-container
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/wireless-client
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/wireless-client
      radios:
        - name: wifi
          medium: rf24
          network: home
          device: wlan0
          mode: station
          addressing: dhcp
          defaultRoute: true
      config:
        command: ["/usr/local/bin/wireless-client"]
      dependsOn:
        - gateway
    - name: client-5
      type: generic-container
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/wireless-client
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/wireless-client
      radios:
        - {name: wifi, medium: rf5, network: home, device: wlan0, mode: station, addressing: dhcp, defaultRoute: true}
      config:
        command: ["/usr/local/bin/wireless-client"]
      dependsOn: [gateway]
    - name: client-6
      type: generic-container
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/wireless-client
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/wireless-client
      radios:
        - {name: wifi, medium: rf6, network: home, device: wlan0, mode: station, addressing: dhcp, defaultRoute: true}
      config:
        command: ["/usr/local/bin/wireless-client"]
      dependsOn: [gateway]