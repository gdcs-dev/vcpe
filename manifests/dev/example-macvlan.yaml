apiVersion: vcpe.dev/v1
kind: Deployment
metadata:
  name: example-macvlan
  labels:
    scenario: example-macvlan
  annotations:
    description: "Full vCPE lab using macvlan WAN — BNG, WebPA, Gateway, event-sink, and Alpine client"
spec:
  maxReplicasPerService: 3
  maxActiveDeployments: 10
  # Network topology — WAN uses macvlan so the BNG container appears directly
  # on the physical LAN (eth0). External physical devices send DHCP requests
  # to eth0 and receive leases from the BNG's DHCP server.
  #
  # Change driverOptions.parent to match your physical NIC (e.g. eth0, ens3).
  # On macOS with Podman machine, use the VM's NIC name (e.g. enp0s1).
  #
  #   [physical devices]
  #        |
  #   eth0 (macvlan parent) ─── BNG wan interface (DHCP server)
  #        |
  #   mgmt-bridge (10.10.10.0/24) ── BNG eth0, WebPA eth0
  #        |
  #   cm-bridge   (10.7.201.0/24) ── BNG eth2 (DHCP server for CM segment)
  #        |                              GATEWAY cm
  #   lan-p1-bridge -- GATEWAY (eth0)
  #   lan-p2-bridge -- GATEWAY (eth1)
  #   lan-p3-bridge -- GATEWAY (eth2)
  #   lan-p4-bridge -- GATEWAY (eth3)
  networks:
    - role: mgmt
      ipv4:
        cidr: 10.10.10.0/24
        gateway: 10.10.10.1
        pool: { start: 10.10.10.10, end: 10.10.10.250 }
    # WAN — macvlan network so BNG appears directly on the physical LAN.
    # nat and firewall are not applicable to macvlan networks.
    - role: wan
      ipamDriver: none
      driverOptions:
        parent: eth1 # ← change to your physical NIC name
      ipv4:
        cidr: 10.7.200.0/24
        gateway: 10.7.200.1
        pool: { start: 10.7.200.10, end: 10.7.200.20 }
      driver: macvlan
    - role: cm
      ipamDriver: none
      ipv4:
        cidr: 10.7.201.0/24
        gateway: 10.7.201.1
        pool: { start: 10.7.201.10, end: 10.7.201.250 }
    # GATEWAY LAN ports
    - role: lan-p1
      ipamDriver: none
    - role: lan-p2
      ipamDriver: none
    - role: lan-p3
      ipamDriver: none
    - role: lan-p4
      ipamDriver: none
  services:
    # ── BNG ─────────────────────────────────────────────────────────────────
    # Broadband Network Gateway: DHCP4/RADVD/DNS on WAN and CM segments.
    # The BNG's wan interface appears on the physical LAN via macvlan.
    # Physical devices on that LAN receive DHCP leases from the BNG.
    - name: bng
      type: bng
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/bng
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/bng
        containerfile: services/bng/Containerfile
      interfaces:
        - { role: mgmt, device: mgmt0 }
        - { role: wan, device: wan0, defaultRoute: true, ipv4: "10.7.200.1" }
        - { role: cm, device: cm0, ipv4: "10.7.201.1" }
      config:
        access:
          - role: wan
            dhcp4:
              subnet: 10.7.200.0/24
              ranges:
                - { start: 10.7.200.100, end: 10.7.200.200 }
              options:
                routers: 10.7.200.1
              leaseSeconds: 3600
          - role: cm
            dhcp4:
              subnet: 10.7.201.0/24
              ranges:
                - { start: 10.7.201.100, end: 10.7.201.200 }
              options:
                routers: 10.7.201.1
              leaseSeconds: 3600
    # ── WebPA / WebConfig ────────────────────────────────────────────────────
    # USP/WebPA device-management server; CPEs contact it via mgmt network.
    - name: webpa
      type: webpa
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/webpa
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/webpa
        containerfile: services/webpa/Containerfile
      interfaces:
        - { role: mgmt }
      dependsOn:
        - bng
    # ── GATEWAY ─────────────────────────────────────────────────────────────────
    # Cable-modem / CPE simulator. Gets a DHCP lease from BNG on WAN (erouter0),
    # bridges LAN ports for attached clients. LAN gateway IP is statically
    # configured via the lan.ipv4 option.
    - name: gateway
      type: gateway
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/gateway
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/gateway
      interfaces:
        - { role: wan, device: erouter0, ipv4: "10.7.200.10" }
        - { role: cm, device: wan0, ipv4: "10.7.201.10" }
        - { role: lan-p1, device: eth0, bridge: brlan0 }
        - { role: lan-p2, device: eth1, bridge: brlan0 }
        - { role: lan-p3, device: eth2, bridge: brlan0 }
        - { role: lan-p4, device: eth3, bridge: brlan0 }
      dependsOn:
        - bng
      bridges:
        - name: brlan0
          ipv4: 10.0.0.1/24
          dhcpStart: 10.0.0.100
          dhcpEnd: 10.0.0.200
      config:
        env:
          LAN_DNS: "10.0.0.1"
    - name: client
      type: generic-container
      replicas: 1
      image:
        repository: docker.io/library/alpine
        tag: "3.19"
        pullPolicy: always-pull
      interfaces:
        - role: lan-p1
          defaultRoute: true
      config:
        env:
          VCPE_INIT_NAMESERVER_FROM_ROUTE: "1"
        command: ["sleep", "infinity"]
      dependsOn:
        - gateway
