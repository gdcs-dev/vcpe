apiVersion: vcpe.dev/v1
kind: Deployment
metadata:
  name: xb10
  labels:
    scenario: xb10
    environment: development
spec:
  maxReplicasPerService: 3
  maxActiveDeployments: 10
  #
  #   [internet / host]
  #        |
  #   mgmt-bridge (10.10.10.0/24)  ── BNG eth0, WebPA eth0
  #        |
  #   wan-bridge  (10.7.200.0/24)  ── BNG eth1 (DHCP server)
  #        |                              GATEWAY wan (DHCP client, erouter0)
  #   cm-bridge   (10.7.201.0/24)  ── BNG eth2 (DHCP server)
  #        |                              GATEWAY cm
  #   2.4/5/6 GHz media (hwsim) -- XB10 radios wl0 / wl1 / wl2 -- Wi-Fi client
  networks:
    - role: mgmt
      ipv4:
        cidr: 10.10.20.0/24
        gateway: 10.10.20.1
        pool: { start: 10.10.20.10, end: 10.10.20.250 }
    - role: wan
      nat: true
      firewall: true
      ipamDriver: none
      ipv4:
        cidr: 10.7.200.0/24
        gateway: 10.7.200.1
        pool: { start: 10.7.200.10, end: 10.7.200.250 }
    - role: cm
      ipamDriver: none
      ipv4:
        cidr: 10.7.201.0/24
        gateway: 10.7.201.1
        pool: { start: 10.7.201.10, end: 10.7.201.250 }
    # GATEWAY LAN ports
    - role: lan-p1
      ipamDriver: none
    - role: lan-p2
      ipamDriver: none
    - role: lan-p3
      ipamDriver: none
    - role: lan-p4
      ipamDriver: none
  # ── Wi-Fi ────────────────────────────────────────────────────────────────
  # The XB10's three radios are hwsim radios on these media. The control plane
  # attaches them to the xb10 container (as wl0/wl1/wl2) after it starts and
  # releases them on `vcpe down`. OneWifi on the XB10 creates the VAPs itself
  # (wl0.1 ...). Each radio's slot-0 VAP below sets the XB10's private Wi-Fi
  # on that band (private_ssid_2g/5g/6g): its SSID and passphrase come from
  # the network and secret here, its BSSID from vCPE. OneWifi keeps its own
  # security mode (WPA3-Personal on 6 GHz, WPA3-Personal-Transition on
  # 2.4/5 GHz), which a wpa3-personal client joins.
  wirelessMedia:
    - {name: rf24, band: 2.4ghz, channel: 1, widthMHz: 20}
    - {name: rf5, band: 5ghz, channel: 36, widthMHz: 20}
    - {name: rf6, band: 6ghz, channel: 5, widthMHz: 20}
  wirelessNetworks:
    - {name: private, ssid: xb10-private, security: wpa3-personal, passphraseSecretRef: xb10-wifi}
  secrets:
    - name: xb10-wifi
      provider: literal
      value: vcpe-development-only
  services:
    # ── BNG ─────────────────────────────────────────────────────────────────
    # Broadband Network Gateway: DHCP4/RADVD/DNS on WAN and CM segments,
    # iptables MASQUERADE for WAN traffic leaving via mgmt.
    - name: bng
      type: bng
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/bng
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/bng
      interfaces:
        - { role: mgmt, device: mgmt0 }
        - { role: wan, device: wan0, defaultRoute: true, ipv4: "10.7.200.1", addressing: static }
        - { role: cm, device: cm0, ipv4: "10.7.201.1", addressing: static }
      config:
        access:
          - role: wan
            dhcp4:
              subnet: 10.7.200.0/24
              ranges:
                - { start: 10.7.200.100, end: 10.7.200.200 }
              options:
                routers: 10.7.200.1
              leaseSeconds: 3600
          - role: cm
            dhcp4:
              subnet: 10.7.201.0/24
              ranges:
                - { start: 10.7.201.100, end: 10.7.201.200 }
              options:
                routers: 10.7.201.1
              leaseSeconds: 3600
    # ── WebPA / WebConfig ────────────────────────────────────────────────────
    # USP/WebPA device-management server; CPEs contact it via mgmt network.
    - name: webpa
      type: webpa
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/webpa
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/webpa
        containerfile: services/webpa/Containerfile
      interfaces:
        - { role: mgmt }
      dependsOn:
        - bng
    # ── Event Sink ────────────────────────────────────────────────────────────
    # Generic XMiDT webhook consumer. Registers a Caduceus webhook via Argus
    # and logs all matching WRP events as structured JSON to stdout.
    # Default filter: apparmor/.* (captures AppArmor simulator events).
    # Override WEBHOOK_EVENTS_REGEX to capture any other event type.
    - name: event-sink
      type: event-sink
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/event-sink
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/event-sink
        containerfile: services/event-sink/Containerfile
      interfaces:
        - { role: mgmt }
      config:
        env:
          # Must match webpa's baked-in dev Argus credentials
          # (services/webpa/assets/argus.yaml authx.inbound.basic).
          ARGUS_URL: "http://argus:6600"
          ARGUS_BASIC_AUTH: "dXNlcjpwYXNz"
          WEBHOOK_URL: "http://event-sink:8080/webhook"
          WEBHOOK_EVENTS_REGEX: ".*"
          WEBHOOK_DEVICE_MATCHER: ".*"
          WEBHOOK_SECRET: "vcpe-dev-webhook-secret"
          LISTEN_ADDR: ":8080"
      dependsOn:
        - bng
    # ── Oktopus ──────────────────────────────────────────────────────────────
    # USP controller. The XB10's USP agent (usp-pa) connects to it over STOMP
    # (oktopus:61613, services/xb10/container/usp_factory_reset.conf).
    - name: oktopus
      type: oktopus
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/oktopus
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/oktopus
      interfaces:
        - { role: mgmt }
      dependsOn:
        - bng
    # ── XB10 ─────────────────────────────────────────────────────────────────
    # RDK-B gateway simulator. Gets a DHCP lease from BNG on WAN (erouter0),
    # bridges LAN ports for attached clients.
    - name: xb10
      type: xb10
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/xb10
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/xb10
        containerfile: services/xb10/Containerfile
        platforms: [linux/arm64]
      interfaces:
        - { role: wan, device: cm0 }
        - { role: cm, device: wan0 }
        - { role: lan-p1, device: eth0 }
        - { role: lan-p2, device: eth1 }
        - { role: lan-p3, device: eth2 }
        - { role: lan-p4, device: eth3 }
      # RDK-B's own LAN bridge, named so the VAP declarations can refer to it.
      bridges:
        - name: brlan0
      # wl0 = 2.4 GHz, wl1 = 5 GHz, wl2 = 6 GHz, as on the XB10.
      radios:
        - name: wifi24
          medium: rf24
          device: wl0
          mode: ap
          vaps:
            - {slot: 0, network: private, bridge: brlan0}
        - name: wifi5
          medium: rf5
          device: wl1
          mode: ap
          vaps:
            - {slot: 0, network: private, bridge: brlan0}
        - name: wifi6
          medium: rf6
          device: wl2
          mode: ap
          vaps:
            - {slot: 0, network: private, bridge: brlan0}
      config:
        env:
          LAN_DNS: "10.0.0.1"
      #volumes:
      #  - /mnt/docker_disk/shared/xb10-dev:/home/root/xb10-dev:rw
      #  - /mnt/docker_disk/shared/downloads:/home/root/shared/downloads:rw
      dependsOn:
        - bng
    # ── Wi-Fi client ─────────────────────────────────────────────────────────
    # Station on the 2.4 GHz medium. Joins the XB10's private network and gets
    # a LAN address (10.0.0.x) from the XB10 over brlan0. OneWifi on the XB10
    # beacons about 40 s after the container starts, longer than the client's
    # default 30 s association timeout, so the client waits longer.
    - name: client
      type: generic-container
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/client
        tag: dev
        pullPolicy: build-if-missing
        buildContext: services/client
      radios:
        - {name: wifi, medium: rf24, network: private, device: wlan0, mode: station, addressing: dhcp, defaultRoute: true}
      config:
        command: ["/usr/local/bin/client"]
        env:
          VCPE_ASSOCIATION_TIMEOUT_SECONDS: "150"
      dependsOn: [xb10]
