apiVersion: vcpe.dev/v1
kind: Deployment
metadata:
  name: xb10
  labels:
    scenario: xb10
spec:
  maxReplicasPerService: 3
  maxActiveDeployments: 10
  #
  #   [internet / host]
  #        |
  #   mgmt-bridge (10.10.10.0/24)  ── BNG eth0, WebPA eth0
  #        |
  #   wan-bridge  (10.7.200.0/24)  ── BNG eth1 (DHCP server)
  #        |                              GATEWAY wan (DHCP client, erouter0)
  #   cm-bridge   (10.7.201.0/24)  ── BNG eth2 (DHCP server)
  #        |                              GATEWAY cm
  networks:
    - role: mgmt
      ipv4:
        cidr: 10.10.20.0/24
        gateway: 10.10.20.1
        pool: { start: 10.10.20.10, end: 10.10.20.250 }
    - role: wan
      nat: true
      firewall: true
      ipamDriver: none
      ipv4:
        cidr: 10.7.200.0/24
        gateway: 10.7.200.1
        pool: { start: 10.7.200.10, end: 10.7.200.250 }
    - role: cm
      ipamDriver: none
      ipv4:
        cidr: 10.7.201.0/24
        gateway: 10.7.201.1
        pool: { start: 10.7.201.10, end: 10.7.201.250 }
    # GATEWAY LAN ports
    - role: lan-p1
      ipamDriver: none
    - role: lan-p2
      ipamDriver: none
    - role: lan-p3
      ipamDriver: none
    - role: lan-p4
      ipamDriver: none
  services:
    # ── BNG ─────────────────────────────────────────────────────────────────
    # Broadband Network Gateway: DHCP4/RADVD/DNS on WAN and CM segments,
    # iptables MASQUERADE for WAN traffic leaving via mgmt.
    - name: bng
      type: bng
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/bng
        tag: v0.3.1
        pullPolicy: always-pull
        buildContext: services/bng
      interfaces:
        - { role: mgmt, device: mgmt0 }
        - { role: wan, device: wan0, defaultRoute: true, ipv4: "10.7.200.1", addressing: static }
        - { role: cm, device: cm0, ipv4: "10.7.201.1", addressing: static }
      config:
        access:
          - role: wan
            dhcp4:
              subnet: 10.7.200.0/24
              ranges:
                - { start: 10.7.200.100, end: 10.7.200.200 }
              options:
                routers: 10.7.200.1
              leaseSeconds: 3600
          - role: cm
            dhcp4:
              subnet: 10.7.201.0/24
              ranges:
                - { start: 10.7.201.100, end: 10.7.201.200 }
              options:
                routers: 10.7.201.1
              leaseSeconds: 3600
    # ── WebPA / WebConfig ────────────────────────────────────────────────────
    # USP/WebPA device-management server; CPEs contact it via mgmt network.
    - name: webpa
      type: webpa
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/webpa
        tag: v0.3.1
        pullPolicy: always-pull
        buildContext: services/webpa
        containerfile: services/webpa/Containerfile
      interfaces:
        - { role: mgmt }
      dependsOn:
        - bng
    # ── Event Sink ────────────────────────────────────────────────────────────
    # Generic XMiDT webhook consumer. Registers a Caduceus webhook via Argus
    # and logs all matching WRP events as structured JSON to stdout.
    # Default filter: apparmor/.* (captures AppArmor simulator events).
    # Override WEBHOOK_EVENTS_REGEX to capture any other event type.
    - name: event-sink
      type: event-sink
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/event-sink
        tag: v0.3.1
        pullPolicy: always-pull
        buildContext: services/event-sink
        containerfile: services/event-sink/Containerfile
      interfaces:
        - { role: mgmt }
      config:
        env:
          # Must match webpa's baked-in dev Argus credentials
          # (services/webpa/assets/argus.yaml authx.inbound.basic).
          ARGUS_URL: "http://argus:6600"
          ARGUS_BASIC_AUTH: "dXNlcjpwYXNz"
          WEBHOOK_URL: "http://event-sink:8080/webhook"
          WEBHOOK_EVENTS_REGEX: ".*"
          WEBHOOK_DEVICE_MATCHER: ".*"
          WEBHOOK_SECRET: "vcpe-dev-webhook-secret"
          LISTEN_ADDR: ":8080"
      dependsOn:
        - bng
    # ── XB10 ─────────────────────────────────────────────────────────────────
    # RDK-B gateway simulator. Gets a DHCP lease from BNG on WAN (erouter0),
    # bridges LAN ports for attached clients.
    - name: xb10
      type: xb10
      replicas: 1
      image:
        repository: ghcr.io/gdcs-dev/xb10
        tag: v0.3.1
        pullPolicy: always-pull
        buildContext: services/xb10
        containerfile: services/xb10/Containerfile
        platforms: [linux/arm64]
      interfaces:
        - { role: wan, device: cm0 }
        - { role: cm, device: wan0 }
        - { role: lan-p1, device: eth0 }
        - { role: lan-p2, device: eth1 }
        - { role: lan-p3, device: eth2 }
        - { role: lan-p4, device: eth3 }
      config:
        env:
          LAN_DNS: "10.0.0.1"
      dependsOn:
        - bng
